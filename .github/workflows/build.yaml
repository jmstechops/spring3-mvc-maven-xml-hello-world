name:  build and deploy

on:
  push:
    branches: [ master ]
  

jobs:
  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Setup Java 8
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'
    - name: Verify Java version
      run: java -version
    - name: Build with Maven
      run: mvn package
    - name: tomcat deploy
      run: curl -v -u admin:admin -T /home/ec2-user/actions-runner/_work/spring3-mvc-maven-xml-hello-world/spring3-mvc-maven-xml-hello-world/target/spring3-mvc-maven-xml-hello-world-1.2.war 'http://ec2-13-201-7-118.ap-south-1.compute.amazonaws.com:8081/manager/text/deploy?path=/github_action_spring&autoDeploy=true'

